<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using a cute placeholder gif for the initial state -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>

    <div class="container" id="card">
        <div id="questionContainer">
            <div class="gif-container">
                <!-- Cute bear asking question gif -->
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYmZlZmRjcnZqam00eW54aTh2N3B6b2Z6eW94eW94eW94eW94eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif"
                    alt="Cute Bear">
            </div>
            <h1>Will you be my Valentine?</h1>
            <div class="buttons">
                <button class="btn" id="yesBtn">Có</button>
                <button class="btn" id="noBtn">Không</button>
            </div>
        </div>

        <div id="successMessage">
            <div class="gif-container">
                <!-- User provided image: Dog with rose -->
                <img src="success_img.jpg" alt="Dog giving flower" style="width: 100%; max-width: 400px; height: auto;">
            </div>
            <h1 class="love-text">I love you too! ❤️</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
